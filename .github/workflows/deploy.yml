name: Deploy to Cloudflare

# Publica el sitio en Cloudflare en cada push a main.
# Requiere dos secrets en el repo (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   -> token con permiso "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID  -> ID de tu cuenta Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js static export -> ./out)
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.114.17"
          command: deploy
